name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Lint, tests, eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tests
        run: uv run pytest
      - name: Eval (offline, no API key)
        run: |
          if [ -n "${EVAL_NEEDS_API:-}" ]; then echo "Eval needs an API key; skipped in CI."; else uv run python -m evals.run; fi
        env:
          EVAL_NEEDS_API: ${{ vars.EVAL_NEEDS_API }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
